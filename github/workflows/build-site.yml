name: Build Boss Picker site

on:
  push:
    branches: [main]
    paths-ignore:
      - levels.json   # levels load straight from GitHub, no rebuild needed
  workflow_dispatch:
  schedule:
    - cron: "0 13 * * 1"   # every Monday, picks up LSS game updates

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30   # a hung build can't block the queue
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install image tools
        run: pip install pillow numpy

      - name: Put the uploaded files where the builder expects them
        run: |
          shopt -s nullglob
          mkdir -p tools/site turned-in
          for f in build_boss.py build_site.py make_modpacks.py; do [ -f "$f" ] && cp "$f" tools/; done
          for f in sw.js boss-boot.js bosses.html; do [ -f "$f" ] && cp "$f" tools/site/; done
          for z in *.zip *.ZIP; do cp "$z" turned-in/; done
          echo "Bosses to build:"; ls turned-in

      - name: Check which game version LSS is running
        id: ver
        run: |
          # If LSS is slow or blocks this check, keep going. build_site.py checks again with retries.
          V=$(curl -fsSL --retry 3 --retry-delay 5 -A "Mozilla/5.0" https://levelsharesquare.com/html5/supermarioconstruct/offline.json | python -c "import sys,json; print(json.load(sys.stdin)['version'])") || V=""
          echo "version=${V:-unknown}" >> "$GITHUB_OUTPUT"
          echo "LSS game version: ${V:-unknown}"

      - name: Reuse the downloaded game if it hasn't changed
        uses: actions/cache@v4
        with:
          path: site
          key: smc-game-${{ steps.ver.outputs.version }}
          restore-keys: smc-game-   # no exact match? reuse the newest cached game instead of failing

      - name: Build the site and every boss
        run: |
          rm -rf site/bosses
          python tools/build_site.py turned-in site
          [ -f boss-maker.html ] && cp boss-maker.html site/ || true
          [ -f hub.html ] && cp hub.html site/ || true
          [ -f levels.json ] && cp levels.json site/ || true

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
