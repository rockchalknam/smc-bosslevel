<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Boss Picker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Press+Start+2P&display=swap">
<style>
:root{
  --stone:#1d1a2b; --wall:#2a2640; --brick:#3a3456; --mortar:#57507a;
  --text:#efeaf7; --muted:#b3abc9; --lava:#ff7a2f; --lava-deep:#c4481a; --coin:#ffd34d;
  --display:"Press Start 2P", ui-monospace, "Courier New", monospace;
  --body:"Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--stone);color:var(--text);font-family:var(--body);font-size:16px;line-height:1.5}
.wrap{max-width:1000px;margin:0 auto;padding-inline:16px;padding-block:28px 64px;display:grid;gap:22px}
h1{font-family:var(--display);font-size:clamp(20px,4.5vw,30px);line-height:1.3;margin:0;color:var(--coin);text-shadow:3px 3px 0 var(--lava-deep)}
.lede{margin:0;color:var(--muted);max-width:60ch}
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
input{font:inherit;padding:9px 12px;border-radius:4px;border:2px solid var(--mortar);background:var(--wall);color:var(--text);width:16em;max-width:100%}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
a.card{display:grid;gap:8px;justify-items:center;text-decoration:none;color:var(--text);background:var(--wall);border:2px solid var(--brick);border-radius:6px;padding:14px 10px}
a.card:hover,a.card:focus-visible{border-color:var(--coin);outline:none}
.art{height:110px;width:100%;display:grid;place-items:end center;background:repeating-conic-gradient(#25213a 0 25%,#2c2744 0 50%) 0 0/12px 12px;border-radius:3px}
.art img{image-rendering:pixelated;max-height:104px;max-width:100%}
.name{font-family:var(--display);font-size:10px;letter-spacing:.05em;text-align:center;word-break:break-word}
.play{font-weight:700;font-size:14px;background:var(--lava);color:#1b0f08;border-radius:4px;padding:4px 12px}
a.card.plain .play{background:var(--brick);color:var(--text)}
.empty{color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
  <h1>Boss Picker</h1>
  <p class="lede">Pick a boss, then place Bowser in any level. Whoever you picked shows up in his place, for the whole time you play.</p>
  <div class="tools"><label for="q" class="lede">Find a boss</label><input id="q" type="search" placeholder="Code name"></div>
  <div class="grid" id="grid"><p class="empty">Loading bosses...</p></div>
</div>
<script>
(async function(){
  const grid=document.getElementById("grid"), q=document.getElementById("q");
  let bosses=[];
  try{ const r=await fetch("bosses/index.json",{cache:"no-cache"}); bosses=(await r.json()).bosses||[]; }catch(e){}
  function card(href,name,img,plain){
    const a=document.createElement("a");a.className="card"+(plain?" plain":"");a.href=href;
    const art=document.createElement("span");art.className="art";
    if(img){const i=document.createElement("img");i.src=img;i.alt=name;art.appendChild(i);}
    else{const t=document.createElement("span");t.className="name";t.style.placeSelf="center";t.style.color="var(--muted)";t.textContent="The original";art.appendChild(t);}
    const n=document.createElement("span");n.className="name";n.textContent=name;
    const p=document.createElement("span");p.className="play";p.textContent=plain?"Play":"Fight";
    a.append(art,n,p);return a;
  }
  function render(){
    const term=q.value.trim().toLowerCase();grid.innerHTML="";
    grid.appendChild(card("./?boss=","Normal Bowser",null,true));
    const list=bosses.filter(b=>!term||b.code.includes(term));
    for(const b of list) grid.appendChild(card("./?boss="+encodeURIComponent(b.code),b.code,"bosses/"+b.code+"/thumb.png"));
    if(!bosses.length){const p=document.createElement("p");p.className="empty";p.textContent="No bosses yet. Run build-site to add some.";grid.appendChild(p);}
  }
  q.addEventListener("input",render);render();
})();
</script>
</body>
</html>
